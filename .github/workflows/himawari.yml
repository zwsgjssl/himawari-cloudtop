name: Himawari cloud top

# ひまわりの観測の雲頂の高さ(FL)を日本付近の格子にして Cloudflare の KV に置く(tools/himawari_build.py)。
#  - 30 分ごと(毎時 20 分と 50 分。NOAA に 00 分・30 分の観測が出るのを待ってから)。公開リポジトリなので Actions の時間の制限は無い。
#  - 1 回あたり: NOAA から約 700MB を取って日本付近だけ切り出す(1〜2 分)。KV には 1 時刻 約 400KB、最新 4 時刻(6 時間で消える)。
#  - GitHub は、公開リポジトリで 60 日なにも変更が無いと定期実行を止める。止まらないよう、最後の変更から 40 日たったら空のコミットをする(keepalive)。
# 必要な Secrets(Settings → Secrets and variables → Actions): CF_API_TOKEN・CF_ACCOUNT_ID・CF_KV_WX_ID
on:
  workflow_dispatch:
  schedule:
    - cron: "20,50 * * * *"

permissions:
  contents: write   # keepalive の空のコミットだけに使う

concurrency:
  group: himawari
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet numpy h5py requests
      - name: Build and upload
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_WX_ID: ${{ secrets.CF_KV_WX_ID }}
        run: python3 -u tools/himawari_build.py
      - name: Keepalive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((40*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive (定期実行を止めないため)"
            git push
          fi
