name: Himawari cloud top

# ひまわりの観測の雲頂の高さ(FL)と雲の種類(v169)を日本付近の格子にして Cloudflare の KV に置く(tools/himawari_build.py)。
#  - v168 起動は Cloudflare の Worker の定期実行(v169 10 分ごと、worker/hima.js の himaCron)から。GitHub の schedule は遅れや抜けが多いので使わない。
#    手で動かすときは Actions → Himawari cloud top → Run workflow。
#  - 1 回あたり: NOAA から雲頂(約 700MB)と種類のファイルを取って日本付近だけ切り出す(数分)。KV には 1 時刻 約 800KB、最新 6 時刻(6 時間で消える)。新しい観測が無ければすぐ終わる。
#  - 公開リポジトリなので Actions の時間の制限は無い。手動・API の起動は 60 日の放置でも止まらないので keepalive は要らない。
# 必要な Secrets(Settings → Secrets and variables → Actions): CF_API_TOKEN・CF_ACCOUNT_ID・CF_KV_WX_ID
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: himawari
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet numpy h5py requests
      - name: Build and upload
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_WX_ID: ${{ secrets.CF_KV_WX_ID }}
        run: python3 -u tools/himawari_build.py
