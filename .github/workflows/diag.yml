name: Diag (一回きりの確かめ)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --quiet numpy requests xarray h5netcdf
      - run: python3 -u tools/cld_diag.py 2>&1 | tee log.txt || true; mkdir -p diag_out; cp log.txt diag_out/
      - run: |
          cd diag_out && git init -q && git checkout -q -b diag && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm diag
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag
