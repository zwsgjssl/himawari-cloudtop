name: ctstudy
on:
  push:
    branches: [ctstudy]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --quiet numpy xarray h5netcdf h5py requests pillow matplotlib
      - run: python3 -u tools/ct_look.py 2>&1 | tee log.txt
      - if: always()
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p out; cp log.txt out/log.txt
          git checkout --orphan res && git rm -rfq --cached . && git add -f out && git commit -qm res && git push -f origin res:ctstudy-out
